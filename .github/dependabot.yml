version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Wait a few days before proposing brand-new releases (defence against
    # freshly published malicious versions). Security updates are not delayed.
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "security"
